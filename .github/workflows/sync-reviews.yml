name: Google yorumlarını senkronla

on:
  schedule:
    - cron: "17 */2 * * *"   # 2 saatte bir (Türkiye saatiyle de 2 saatte bir)
  workflow_dispatch: {}       # Actions sekmesinden elle çalıştırma
  push:
    branches: [main]
    paths: ["public/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yorumları çek
        if: github.event_name != 'push'
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          PLACE_ID: ${{ secrets.PLACE_ID }}
          MIN_RATING: ${{ vars.MIN_RATING }}
        run: node scripts/sync-reviews.mjs
      - name: Değişiklik varsa kaydet
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet public/reviews.json; then
            git config user.name "gm-yorum-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/reviews.json
            git commit -m "Google yorumları güncellendi"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
